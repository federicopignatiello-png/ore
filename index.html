<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#131417">
<title>ORE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="ORE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#131417;--fg:#F9F7F3;--mute:#8a8a8a;--line:#26272b;--acc:#F9F7F3;--lime:#D6F73D}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font-size:13px;letter-spacing:.32em;font-weight:600}
.sub{font-size:11px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
section{margin-top:30px}
.label{font-size:11px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase;margin-bottom:12px;display:flex;justify-content:space-between}
.timer{font-size:80px;font-weight:300;letter-spacing:-.02em}
.timer small{display:block;font-size:12px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase;margin-top:4px;font-weight:400}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
select,input,button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:0;padding:11px 12px;-webkit-appearance:none;appearance:none}
select{flex:1;min-width:140px}
input{flex:1;min-width:0}
input[type=date]{min-width:140px}
button{cursor:pointer;letter-spacing:.12em;text-transform:uppercase;font-size:12px}
button.pri{background:var(--lime);color:#131417;border-color:var(--lime);border-radius:50%;width:64px;height:64px;padding:0;font-weight:600}
button.pri.stop{background:transparent;color:var(--fg);border:2px solid var(--fg)}
.timer.on{color:var(--lime)}
.amt{color:var(--mute);font-size:13px;margin-left:10px}
.row.center{align-items:center}
button:active{opacity:.6}
.tabs{display:flex;gap:18px}
.tabs button{border:0;padding:0;color:var(--mute);font-size:11px}
.tabs button.on{color:var(--fg)}
.cat{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%}
.bar{grid-column:2/4;height:2px;background:var(--line);margin-top:-4px}
.bar i{display:block;height:100%}
.total{display:flex;justify-content:space-between;padding-top:14px;font-weight:600}
.entry{display:grid;grid-template-columns:10px 1fr auto auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.entry .meta{font-size:12px;color:var(--mute)}
.x{border:0;padding:4px 6px;color:var(--mute);font-size:16px;letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:7px 6px 7px 10px;font-size:13px}
.empty{color:var(--mute);font-size:13px;padding:10px 0}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.foot button{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>ORE</h1><span class="sub" id="today"></span></header>

  <section>
    <div class="label"><span>Timer</span><span id="runCat"></span></div>
    <div class="timer num" id="clock">0:00:00<small id="clockSub">Fermo</small></div>
    <div class="row center">
      <select id="timerCat"></select>
      <button class="pri" id="toggle">Avvia</button>
    </div>
  </section>

  <section>
    <div class="label"><span>Aggiungi a mano</span></div>
    <div class="row">
      <select id="mCat"></select>
      <input type="date" id="mDate">
    </div>
    <div class="row">
      <input id="mDur" placeholder="Durata, es. 1:30 o 2,5" inputmode="decimal">
      <input id="mNote" placeholder="Nota (facoltativa)">
      <button id="mAdd">Aggiungi</button>
    </div>
  </section>

  <section>
    <div class="label"><span>Riepilogo</span>
      <span class="tabs" id="tabs">
        <button data-p="week" class="on">Settimana</button>
        <button data-p="month">Mese</button>
        <button data-p="all">Tutto</button>
      </span>
    </div>
    <div id="summary"></div>
  </section>

  <section>
    <div class="label"><span>Registro</span><span id="count"></span></div>
    <div id="log"></div>
  </section>

  <section>
    <div class="label"><span>Categorie</span></div>
    <div class="chips" id="cats"></div>
    <div class="row">
      <input id="newCat" placeholder="Nuova categoria">
      <input id="newRate" placeholder="€/ora (facoltativo)" inputmode="decimal" style="max-width:150px">
      <button id="addCat">Aggiungi</button>
    </div>
  </section>

  <section>
    <div class="label"><span>Dati</span><span>Salvati solo su questo dispositivo</span></div>
    <div class="foot">
      <button id="csv">Esporta CSV</button>
      <button id="bak">Backup</button>
      <button id="imp">Ripristina</button>
      <input type="file" id="file" accept=".json" hidden>
    </div>
  </section>
</div>

<script>
const KEY='ore.v1';
const PALETTE=['#c8b89a','#8e9aab','#9a9a6e','#b8836a','#a08aa0','#7f9e96','#b5a37a','#8a8f99'];
const $=id=>document.getElementById(id);
let S=load();
let period='week';

function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.cats)return d;}catch(e){}
  return{cats:[{id:uid(),name:'Straordinario',color:PALETTE[0]},{id:uid(),name:'Lavoro',color:PALETTE[1]},{id:uid(),name:'Progetti',color:PALETTE[2]}],entries:[],running:null};
}
function save(){localStorage.setItem(KEY,JSON.stringify(S));}
function uid(){return Math.random().toString(36).slice(2,10);}
function cat(id){return S.cats.find(c=>c.id===id)||{name:'(eliminata)',color:'#444'};}
function money(v){return v.toLocaleString('it-IT',{style:'currency',currency:'EUR'});}
function pad(n){return String(n).padStart(2,'0');}
function fmt(min){min=Math.round(min);const h=Math.floor(min/60),m=min%60;return h+':'+pad(m);}
function fmtClock(ms){const s=Math.floor(ms/1000);return Math.floor(s/3600)+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60);}
function isoDay(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function parseDur(v){
  v=v.trim().replace(',','.');
  if(!v)return NaN;
  if(v.includes(':')){const[h,m]=v.split(':');return (+h||0)*60+(+m||0);}
  return parseFloat(v)*60;
}

function periodStart(){
  const n=new Date();n.setHours(0,0,0,0);
  if(period==='week'){const d=(n.getDay()+6)%7;n.setDate(n.getDate()-d);return isoDay(n);}
  if(period==='month'){n.setDate(1);return isoDay(n);}
  return '0000-00-00';
}

function renderSelects(){
  const opts=S.cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  ['timerCat','mCat'].forEach(id=>{const el=$(id),v=el.value;el.innerHTML=opts;if(S.cats.some(c=>c.id===v))el.value=v;});
  if(S.running)$('timerCat').value=S.running.cat;
}

function renderSummary(){
  const from=periodStart();
  const tot={};let all=0;
  S.entries.filter(e=>e.date>=from).forEach(e=>{tot[e.cat]=(tot[e.cat]||0)+e.min;all+=e.min;});
  const ids=Object.keys(tot).sort((a,b)=>tot[b]-tot[a]);
  if(!ids.length){$('summary').innerHTML='<div class="empty">Nessuna ora in questo periodo.</div>';return;}
  const max=Math.max(...ids.map(i=>tot[i]));const amt=ids.reduce((a,i)=>a+(cat(i).rate||0)*tot[i]/60,0);
  $('summary').innerHTML=ids.map(i=>{const c=cat(i);return `<div class="cat"><span class="dot" style="background:${c.color}"></span><span>${esc(c.name)}</span><span class="num">${fmt(tot[i])}${c.rate?`<span class="amt">${money(tot[i]/60*c.rate)}</span>`:''}</span><div class="bar"><i style="width:${tot[i]/max*100}%;background:${c.color}"></i></div></div>`;}).join('')+`<div class="total"><span>Totale</span><span class="num">${fmt(all)}${amt?`<span class="amt">${money(amt)}</span>`:''}</span></div>`;
}

function renderLog(){
  const list=[...S.entries].sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  $('count').textContent=list.length?list.length+' voci':'';
  if(!list.length){$('log').innerHTML='<div class="empty">Ancora niente. Avvia il timer o aggiungi a mano.</div>';return;}
  $('log').innerHTML=list.slice(0,60).map(e=>{const c=cat(e.cat);const d=new Date(e.date+'T12:00');return `<div class="entry"><span class="dot" style="background:${c.color}"></span><div><div>${esc(c.name)}</div><div class="meta">${d.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})}${e.note?' · '+esc(e.note):''}</div></div><span class="num">${fmt(e.min)}</span><button class="x" data-del="${e.id}" aria-label="Elimina">×</button></div>`;}).join('');
}

function renderCats(){
  $('cats').innerHTML=S.cats.map(c=>`<span class="chip"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}${c.rate?` <span class="amt" style="margin:0">${money(c.rate)}/h</span>`:''}<button class="x" data-rmcat="${c.id}" aria-label="Elimina">×</button></span>`).join('');
}

function renderTimer(){
  const r=S.running;
  $('toggle').textContent=r?'Ferma':'Avvia';
  $('toggle').classList.toggle('stop',!!r);$('clock').classList.toggle('on',!!r);
  $('timerCat').disabled=!!r;
  $('runCat').textContent=r?cat(r.cat).name:'';
  const ms=r?Date.now()-r.start:0;
  $('clock').firstChild.nodeValue=fmtClock(ms);
  $('clockSub').textContent=r?'Dalle '+new Date(r.start).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):'Fermo';
}

function render(){renderSelects();renderSummary();renderLog();renderCats();renderTimer();}

$('toggle').onclick=()=>{
  if(!S.cats.length)return alert('Crea prima una categoria.');
  if(S.running){
    const r=S.running,min=(Date.now()-r.start)/60000;
    if(min>=1)S.entries.push({id:uid(),cat:r.cat,date:isoDay(new Date(r.start)),min:Math.round(min),note:'',ts:Date.now()});
    S.running=null;
  }else S.running={cat:$('timerCat').value,start:Date.now()};
  save();render();
};

$('mAdd').onclick=()=>{
  const min=parseDur($('mDur').value);
  if(!(min>0))return $('mDur').focus();
  if(!S.cats.length)return alert('Crea prima una categoria.');
  S.entries.push({id:uid(),cat:$('mCat').value,date:$('mDate').value||isoDay(new Date()),min:Math.round(min),note:$('mNote').value.trim(),ts:Date.now()});
  $('mDur').value='';$('mNote').value='';
  save();render();
};

$('log').onclick=e=>{const id=e.target.dataset.del;if(id&&confirm('Eliminare questa voce?')){S.entries=S.entries.filter(x=>x.id!==id);save();render();}};
$('cats').onclick=e=>{
  const id=e.target.dataset.rmcat;if(!id)return;
  const n=S.entries.filter(x=>x.cat===id).length;
  if(S.running&&S.running.cat===id)return alert('Ferma prima il timer.');
  if(confirm(n?`Eliminare la categoria e le sue ${n} voci?`:'Eliminare la categoria?')){S.cats=S.cats.filter(c=>c.id!==id);S.entries=S.entries.filter(x=>x.cat!==id);save();render();}
};
$('addCat').onclick=()=>{
  const name=$('newCat').value.trim();if(!name)return;
  const rate=parseFloat($('newRate').value.replace(',','.'))||0;
  S.cats.push({id:uid(),name,color:PALETTE[S.cats.length%PALETTE.length],rate});
  $('newCat').value='';$('newRate').value='';save();render();
};
$('newCat').onkeydown=e=>{if(e.key==='Enter')$('addCat').click();};
$('tabs').onclick=e=>{const p=e.target.dataset.p;if(!p)return;period=p;[...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.p===p));renderSummary();};

function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
$('csv').onclick=()=>{
  const rows=[['data','categoria','ore (h:mm)','ore decimali','importo €','nota']].concat([...S.entries].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>[e.date,cat(e.cat).name,fmt(e.min),(e.min/60).toFixed(2).replace('.',','),cat(e.cat).rate?(e.min/60*cat(e.cat).rate).toFixed(2).replace('.',','):'',e.note]));
  download('ore-'+isoDay(new Date())+'.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv');
};
$('bak').onclick=()=>download('ore-backup-'+isoDay(new Date())+'.json',JSON.stringify(S),'application/json');
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{const d=JSON.parse(t);if(!d.cats||!d.entries)throw 0;if(confirm('Sostituire i dati attuali con il backup?')){S=d;save();render();}}).catch(()=>alert('File di backup non valido.'));
  e.target.value='';
};

$('mDate').value=isoDay(new Date());
$('today').textContent=new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
render();
setInterval(()=>{if(S.running)renderTimer();},1000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
